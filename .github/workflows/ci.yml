name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Two import roots: `app` (API package) and `core` (shared). Mirrors the
  # PYTHONPATH set in the Dockerfile.
  PYTHONPATH: services/api:packages

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff==0.16.2
          ruff check services/ packages/

      # No '|| true' and no '|| echo no tests found'. The isolation test is the
      # evidence for the data-safety claim; a suite that can silently not-run
      # is worse than no suite, because it reads green either way.
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/web

      - name: Lint
        run: npm run lint
        working-directory: apps/web

      - name: Type check
        run: npx tsc --noEmit
        working-directory: apps/web
