# The one-command path from a clean clone: docker compose up
#
# Six services. LocalStack stands in for S3, seed uploads the committed corpus
# into it once and exits, chroma holds the vectors, api serves the request path,
# worker drains the sync queue, and web serves the UI.
#
# api and worker run the same image with different commands. They are separate
# processes so a long sync cannot take the request path down with it and so the
# worker can be restarted on its own - which is exactly why chroma is a service
# rather than a shared directory.

services:
  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=0
      # Keep the seeded bucket across restarts of the stack.
      - PERSISTENCE=1
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Uploads corpus/tolkien into the bucket, then exits. Idempotent: identity is
  # the sha256 of content, so re-seeding the same bytes changes nothing.
  seed:
    build: .
    command: ["python", "/app/infra/seed_localstack.py"]
    environment:
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=tolkien-corpus
      - CORPUS_DIR=/app/corpus/tolkien
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  # Vectors live behind a service because two processes use them. Chroma's
  # in-process client assumes it owns its directory, so the API reading while
  # the worker wrote failed mid-sync with "Error finding id".
  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma-data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Optional so a clean clone boots before you have written .env. Missing
      # keys then surface as a clear per-file sync error instead of a compose
      # parse failure that explains nothing.
      - path: .env
        required: false
    environment:
      - DATA_DIR=/data
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - S3_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      # Dev-login signing key. The whole trust boundary, so it is explicit
      # rather than left to the code default.
      - JWT_SECRET=${JWT_SECRET:-dev-secret-not-for-production}
    volumes:
      # One shared volume: SQLite, the Chroma collections, and the text store.
      # Both Python services mount it because the worker writes what the API
      # reads.
      - platform-data:/data
    depends_on:
      seed:
        condition: service_completed_successfully
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "/app/services/worker/main.py"]
    env_file:
      # Optional so a clean clone boots before you have written .env. Missing
      # keys then surface as a clear per-file sync error instead of a compose
      # parse failure that explains nothing.
      - path: .env
        required: false
    environment:
      - DATA_DIR=/data
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - S3_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - platform-data:/data
    depends_on:
      seed:
        condition: service_completed_successfully
      chroma:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  platform-data:
  localstack-data:
  chroma-data:
