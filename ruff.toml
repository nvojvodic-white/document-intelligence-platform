# Ruff's default rule set widens between releases (0.16 pulled BLE, I, S, UP,
# DTZ and others into the defaults), so an unpinned `pip install ruff` in CI
# can start failing on unchanged code. Select explicitly so the lint contract
# belongs to the repo rather than to whichever ruff the runner fetches.
[lint]
select = ["E4", "E7", "E9", "F"]
